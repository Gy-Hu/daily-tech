<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="每日技术兴趣雷达：编程语言、形式化方法、编译器、芯片设计、本地大模型、AI 工程与网络安全。">
  <title>每日技术兴趣雷达</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f7fb;
      --surface: rgba(255, 255, 255, 0.86);
      --text: #172033;
      --muted: #65708a;
      --line: rgba(23, 32, 51, 0.12);
      --accent: #315ee7;
      --accent-soft: rgba(49, 94, 231, 0.10);
      --shadow: 0 22px 70px rgba(26, 43, 84, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(91, 136, 255, 0.18), transparent 30rem),
        radial-gradient(circle at 90% 15%, rgba(66, 203, 169, 0.13), transparent 26rem),
        var(--bg);
    }
    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 72px 0 96px; }
    header { margin-bottom: 44px; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .76rem; }
    h1 { margin: 12px 0 12px; font-size: clamp(2.2rem, 7vw, 4.8rem); line-height: 1.02; letter-spacing: -.055em; }
    .intro { max-width: 690px; color: var(--muted); font-size: 1.06rem; line-height: 1.75; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 18px; }
    h2 { margin: 0; font-size: 1.05rem; }
    .count { color: var(--muted); font-size: .9rem; }
    .report-list { display: grid; gap: 16px; }
    .report {
      display: grid;
      grid-template-columns: 116px 1fr auto;
      gap: 24px;
      align-items: center;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      transition: transform .18s ease, border-color .18s ease;
      backdrop-filter: blur(18px);
    }
    .report:hover { transform: translateY(-3px); border-color: rgba(49, 94, 231, .42); }
    .date { padding: 16px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); text-align: center; }
    .date strong { display: block; font-size: 1.8rem; line-height: 1; }
    .date span { display: block; margin-top: 5px; font-size: .78rem; font-weight: 700; }
    .report h3 { margin: 0 0 8px; font-size: 1.2rem; }
    .report p { margin: 0; color: var(--muted); line-height: 1.6; }
    .arrow { color: var(--accent); font-size: 1.5rem; }
    footer { margin-top: 42px; color: var(--muted); font-size: .82rem; }
    @media (max-width: 620px) {
      main { padding-top: 48px; }
      .report { grid-template-columns: 82px 1fr; gap: 16px; padding: 18px; }
      .arrow { display: none; }
      .date { padding: 13px 8px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c1220;
        --surface: rgba(20, 29, 49, 0.84);
        --text: #edf2ff;
        --muted: #a5afc3;
        --line: rgba(219, 229, 255, 0.13);
        --accent: #8aa7ff;
        --accent-soft: rgba(138, 167, 255, 0.12);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.25);
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Daily Tech Radar</div>
      <h1>每日技术兴趣雷达</h1>
      <p class="intro">围绕编程语言、形式化方法、编译器、芯片设计、FPGA、本地大模型、AI 工程与网络安全，整理每天值得关注的技术动态。</p>
    </header>

    <section aria-labelledby="archive-heading">
      <div class="toolbar">
        <h2 id="archive-heading">报告归档</h2>
        <span class="count">共 2 期</span>
      </div>
      <div class="report-list">
        <a class="report" href="reports/2026-08-16/index.html">
          <div class="date"><strong>16</strong><span>2026 · 08</span></div>
          <div>
            <h3>2026 年 8 月 16 日技术兴趣雷达</h3>
            <p>程序规格审计、软硬件验证汇流、Agent 执行证据、本地推理预算与 RTL 工具链。</p>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="report" href="reports/2026-08-15/index.html">
          <div class="date"><strong>15</strong><span>2026 · 08</span></div>
          <div>
            <h3>2026 年 8 月 15 日技术兴趣雷达</h3>
            <p>今日趋势、精选技术内容、关注账号动态与可执行建议。</p>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <footer>按日期持续更新 · Asia/Shanghai</footer>
  </main>
</body>
</html>
